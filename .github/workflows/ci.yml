# CI/CD: build e testes em todo PR e push na main; imagem Docker publicada no GHCR a cada merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Um PR novo cancela o run anterior do mesmo PR; na main, cada merge roda até o fim.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # O frontend-maven-plugin baixa o Node para target/; o cache do npm evita baixar os pacotes.
      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # verify = npm ci, typecheck, build e Vitest do frontend + testes do backend
      # (unitários e integração com Testcontainers, que usa o Docker do runner).
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/Poe2BuildAssistant-*.jar
          if-no-files-found: error
          retention-days: 7

  image:
    name: Imagem Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      # Só publica na main; em PR a imagem é construída (valida o Dockerfile) e descartada.
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      # O mesmo jar que passou nos testes do job anterior; nada é recompilado.
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ env.PUBLICAR == 'true' }}

      - name: Build${{ env.PUBLICAR == 'true' && ' e push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
