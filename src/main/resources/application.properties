spring.application.name=Poe2BuildAssistant
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poe2buildassistant}
spring.datasource.username=${DB_USERNAME:hyzard}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Google Gemini (camada gratuita). A chave vem só de variável de ambiente.
# O padrão vazio é proposital: sem a variável, o Spring AI falha no startup com mensagem clara,
# em vez de aceitar o texto literal "${GEMINI_API_KEY}" como chave (chaos K1).
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# Modelo fixado aqui: o padrão do Spring AI 2.0.1 (gemini-2.5-flash) foi descontinuado para chaves
# novas e respondia 404 em toda geração (bug #43). Medição de 21/11/2026 com o catálogo 0.5:
# gemini-3.6-flash acertou 3/3 os nomes do catálogo (14–33 s); os modelos "lite" responderam em
# 1–7 s, mas inventaram nomes em 6/6; 3.7/3.8-flash deram 503 ou passaram de 60 s. Troque sem
# deploy pela variável SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL. Latência: ver #46.
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
# Resposta em JSON (structured output).
spring.ai.google.genai.chat.options.response-mime-type=application/json
# Sem retries escondidos: a regeneração é do caso de uso (#10) e cada retry gasta cota gratuita.
# Atenção: no Spring AI 2.0 este valor vira RetryPolicy.maxRetries (retentativas), então 0 = uma
# única chamada.
spring.ai.retry.max-attempts=0
# Tempo máximo de uma chamada ao LLM, abaixo dos 30 s da meta p90.
app.ai.timeout=25s

# Limites diários de geração (provisórios; dependem da cota real do Gemini). Reset à meia-noite UTC.
app.quota.anonymous-daily=3
app.quota.authenticated-daily=10

# Geração: chamadas ao LLM por pedido (1 + regenerações) e itens por tipo no recorte do catálogo.
# O recorte só é um teto de segurança: o catálogo do patch 0.5 tem 536 suportes e 261 habilidades,
# e a IA precisa ver todos os compatíveis. Com 60, ela só via o começo do alfabeto (chaos S1);
# os nomes inteiros somam poucos milhares de tokens, com folga na janela do Gemini.
app.generation.max-attempts=2
app.generation.slice-max-items=1000

# Salt do hash de IP dos visitantes (só via ambiente). Sem ele, um salt aleatório por processo.
app.quota.ip-salt=${QUOTA_IP_SALT:}

# Login Google (card #14). Credenciais do Google Cloud Console, só via ambiente; redirect
# autorizado: {baseUrl}/login/oauth2/code/google. Sem elas o app sobe, mas "Entrar" não funciona.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:nao-configurado}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:nao-configurado}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Contas que recebem o papel ADMIN no login, separadas por vírgula.
app.security.admin-emails=${ADMIN_EMAILS:}
