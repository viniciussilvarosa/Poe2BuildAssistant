spring.application.name=Poe2BuildAssistant
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/poe2buildassistant}
spring.datasource.username=${DB_USERNAME:hyzard}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Google Gemini (camada gratuita). A chave vem só de variável de ambiente.
# O padrão vazio é proposital: sem a variável, o Spring AI falha no startup com mensagem clara,
# em vez de aceitar o texto literal "${GEMINI_API_KEY}" como chave (chaos K1).
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# Resposta em JSON (structured output). O modelo pode ser trocado pela variável de ambiente
# SPRING_AI_GOOGLE_GENAI_CHAT_OPTIONS_MODEL; a escolha final é questão em aberto do produto.
spring.ai.google.genai.chat.options.response-mime-type=application/json
# Sem retries escondidos: a regeneração é do caso de uso (#10) e cada retry gasta cota gratuita.
# Atenção: no Spring AI 2.0 este valor vira RetryPolicy.maxRetries (retentativas), então 0 = uma
# única chamada.
spring.ai.retry.max-attempts=0
# Tempo máximo de uma chamada ao LLM, abaixo dos 30 s da meta p90.
app.ai.timeout=25s
