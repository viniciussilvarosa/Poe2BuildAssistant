# Logs estruturados (ECS) para extrair as métricas de sucesso do produto.
logging.structured.format.console=ecs

# IP real do cliente atrás do proxy (X-Forwarded-For) para a cota de visitantes.
server.forward-headers-strategy=framework

# Cookie da sessão de login (#83). O Tomcat cria o JSESSIONID olhando a conexão interna do proxy, que é
# HTTP, então não marca Secure sozinho: força aqui. Lax, não Strict: a volta do Google é uma navegação
# vinda de outro site e precisa do cookie para achar o pedido de autorização.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
